services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adscope-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://adscope:adscope_secret@postgres:5432/adscope_db
      - REDIS_URL=redis://redis:6379
      - LLM_PROVIDER=mock
      - STORAGE_PROVIDER=local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adscope-worker
    command: ["npm", "run", "worker"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://adscope:adscope_secret@postgres:5432/adscope_db
      - REDIS_URL=redis://redis:6379
      - LLM_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: adscope-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: adscope
      POSTGRES_PASSWORD: adscope_secret
      POSTGRES_DB: adscope_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adscope -d adscope_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: adscope-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
